<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Emberveil — Veiled Sun / Drift</title>
  <desc id="desc">A lava disc crossed by broken crust plates with molten gaps between them.</desc>
  <style>
    :root {
      --ember-deep: #BC531E;
      --ember: #FF9F5B;
      --ember-core: #FFD173;
      --focus: #FFCC66;
      --veil: #73C7D6;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --ember-deep: #914321;
        --ember: #A44012;
        --ember-core: #A86B00;
        --focus: #A86B00;
        --veil: #1C6570;
      }
    }
  </style>
  <defs>
      <radialGradient id="r-veiled-sun-drift" gradientUnits="userSpaceOnUse" cx="32" cy="44" r="34">
        <stop offset="0" style="stop-color: var(--ember-core)"/>
        <stop offset="0.42" style="stop-color: var(--ember)"/>
        <stop offset="1" style="stop-color: var(--ember-deep)"/>
      </radialGradient></defs>
    <circle cx="32" cy="32" r="22" fill="url(#r-veiled-sun-drift)"/>
    <g fill="var(--veil)">
      <rect x="4" y="27.5" width="21" height="3.5" rx="1.75"/>
      <rect x="31" y="27.5" width="29" height="3.5" rx="1.75"/>
      <rect x="4" y="36.5" width="13" height="4.5" rx="2.25"/>
      <rect x="23" y="36.5" width="37" height="4.5" rx="2.25"/>
      <rect x="8" y="46" width="29" height="5.5" rx="2.75"/>
      <rect x="43" y="46" width="17" height="5.5" rx="2.75"/>
    </g>
</svg>
