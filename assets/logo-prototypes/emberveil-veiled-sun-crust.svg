<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Emberveil — Veiled Sun / Crust</title>
  <desc id="desc">A lava body almost fully covered by thick crust plates, light escaping between them.</desc>
  <style>
    :root {
      --ember-deep: #BC531E;
      --ember: #FF9F5B;
      --ember-core: #FFD173;
      --focus: #FFCC66;
      --veil: #73C7D6;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --ember-deep: #914321;
        --ember: #A44012;
        --ember-core: #A86B00;
        --focus: #A86B00;
        --veil: #1C6570;
      }
    }
  </style>
  <defs>
      <radialGradient id="r-veiled-sun-crust" gradientUnits="userSpaceOnUse" cx="32" cy="40" r="30">
        <stop offset="0" style="stop-color: var(--ember-core)"/>
        <stop offset="0.42" style="stop-color: var(--ember)"/>
        <stop offset="1" style="stop-color: var(--ember-deep)"/>
      </radialGradient></defs>
    <circle cx="32" cy="32" r="22" fill="url(#r-veiled-sun-crust)"/>
    <g fill="var(--veil)">
      <rect x="4" y="17" width="24" height="5" rx="2.5"/>
      <rect x="32" y="17" width="28" height="5" rx="2.5"/>
      <rect x="4" y="27" width="34" height="6" rx="3"/>
      <rect x="42" y="27" width="18" height="6" rx="3"/>
      <rect x="4" y="38.5" width="18" height="6.5" rx="3.25"/>
      <rect x="26" y="38.5" width="34" height="6.5" rx="3.25"/>
      <rect x="10" y="50" width="26" height="5" rx="2.5"/>
      <rect x="40" y="50" width="14" height="5" rx="2.5"/>
    </g>
</svg>
