<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Emberveil — Emberrise / Bloom Lake</title>
  <desc id="desc">A glowing sun above a lava lake, both radiating heat past the horizon.</desc>
  <style>
    :root {
      --ember-deep: #BC531E;
      --ember: #FF9F5B;
      --ember-core: #FFD173;
      --focus: #FFCC66;
      --veil: #73C7D6;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --ember-deep: #914321;
        --ember: #A44012;
        --ember-core: #A86B00;
        --focus: #A86B00;
        --veil: #1C6570;
      }
    }
  </style>
  <defs>
  
      <radialGradient id="b-emberrise-bloom-lake" gradientUnits="userSpaceOnUse" cx="32" cy="36" r="28">
        <stop offset="0" style="stop-color: var(--ember); stop-opacity: 0.55"/>
        <stop offset="0.5" style="stop-color: var(--ember); stop-opacity: 0.2"/>
        <stop offset="1" style="stop-color: var(--ember); stop-opacity: 0"/>
      </radialGradient>
  
      <radialGradient id="r-emberrise-bloom-lake" gradientUnits="userSpaceOnUse" cx="32" cy="34" r="20">
        <stop offset="0" style="stop-color: var(--ember-core)"/>
        <stop offset="0.5" style="stop-color: var(--ember)"/>
        <stop offset="1" style="stop-color: var(--ember-deep)"/>
      </radialGradient>
  
      <radialGradient id="p-emberrise-bloom-lake" gradientUnits="userSpaceOnUse" cx="32" cy="45" r="22">
        <stop offset="0" style="stop-color: var(--ember-core)"/>
        <stop offset="0.45" style="stop-color: var(--ember)"/>
        <stop offset="1" style="stop-color: var(--ember-deep)"/>
      </radialGradient>
    </defs>
    <g transform="translate(0 -2)">
      <circle cx="32" cy="36" r="28" fill="url(#b-emberrise-bloom-lake)"/>
      <path d="M14 34 A18 18 0 0 1 50 34 Z" fill="url(#r-emberrise-bloom-lake)"/>
      <rect x="6" y="34" width="52" height="4.5" rx="2.25" fill="var(--veil)"/>
      <rect x="13" y="42.5" width="38" height="5.5" rx="2.75" fill="url(#p-emberrise-bloom-lake)"/>
      <rect x="20.5" y="51.5" width="23" height="5" rx="2.5" fill="url(#p-emberrise-bloom-lake)"/>
    </g>
</svg>
