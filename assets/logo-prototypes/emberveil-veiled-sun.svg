<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Emberveil — Veiled Sun</title>
  <desc id="desc">A molten sun disc crossed by three cool structural bands.</desc>
  <style>
    :root {
      --ember-deep: #BC531E;
      --ember: #FF9F5B;
      --ember-core: #FFD173;
      --focus: #FFCC66;
      --veil: #73C7D6;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --ember-deep: #914321;
        --ember: #A44012;
        --ember-core: #A86B00;
        --focus: #A86B00;
        --veil: #1C6570;
      }
    }
  </style>
  <defs>
      <linearGradient id="g-veiled-sun" gradientUnits="userSpaceOnUse" x1="32" y1="10" x2="32" y2="54">
        <stop offset="0" style="stop-color: var(--ember-deep)"/>
        <stop offset="0.52" style="stop-color: var(--ember)"/>
        <stop offset="1" style="stop-color: var(--ember-core)"/>
      </linearGradient></defs>
    <circle cx="32" cy="32" r="22" fill="url(#g-veiled-sun)"/>
    <rect x="4" y="27.5" width="56" height="3.5" rx="1.75" fill="var(--veil)"/>
    <rect x="4" y="36.5" width="56" height="4.5" rx="2.25" fill="var(--veil)"/>
    <rect x="4" y="46" width="56" height="5.5" rx="2.75" fill="var(--veil)"/>
</svg>
