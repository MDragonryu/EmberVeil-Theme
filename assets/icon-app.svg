<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Emberveil app icon</title>
  <desc id="desc">A sun rising over a lava lake on a quiet tile, both radiating heat past the horizon.</desc>
  <style>
    /* Tiled optical size: a known ground, so the full Emberrise / Bloom Lake mark
       is used here, ember bloom included. Surfaces and syntax colours are the
       Emberveil tokens from emberveil/specs. */
    :root {
      --bg: #242632;
      --rim: #303342;
      --ember-deep: #BC531E;
      --ember: #FF9F5B;
      --ember-core: #FFD173;
      --veil: #73C7D6;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #E4DED2;
        --rim: #CEC6BA;
        --ember-deep: #914321;
        --ember: #A44012;
        --ember-core: #A86B00;
        --veil: #1C6570;
      }
    }
  </style>

  <defs>
    <radialGradient id="bloom" gradientUnits="userSpaceOnUse" cx="32" cy="36" r="28">
      <stop offset="0" style="stop-color: var(--ember); stop-opacity: 0.55"/>
      <stop offset="0.5" style="stop-color: var(--ember); stop-opacity: 0.2"/>
      <stop offset="1" style="stop-color: var(--ember); stop-opacity: 0"/>
    </radialGradient>
    <radialGradient id="sun" gradientUnits="userSpaceOnUse" cx="32" cy="34" r="20">
      <stop offset="0" style="stop-color: var(--ember-core)"/>
      <stop offset="0.5" style="stop-color: var(--ember)"/>
      <stop offset="1" style="stop-color: var(--ember-deep)"/>
    </radialGradient>
    <radialGradient id="lake" gradientUnits="userSpaceOnUse" cx="32" cy="45" r="22">
      <stop offset="0" style="stop-color: var(--ember-core)"/>
      <stop offset="0.45" style="stop-color: var(--ember)"/>
      <stop offset="1" style="stop-color: var(--ember-deep)"/>
    </radialGradient>
  </defs>

  <!-- Quiet material surface, Emberveil large radius -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="var(--bg)"/>
  <rect x="4" y="4" width="56" height="56" rx="13" fill="none" stroke="var(--rim)" stroke-width="2"/>

  <g transform="translate(32 32) scale(0.82) translate(-32 -32)">
    <g transform="translate(0 -2)">
      <!-- Heat bleeding past the mark into the surface -->
      <circle cx="32" cy="36" r="28" fill="url(#bloom)"/>
      <path d="M14 34 A18 18 0 0 1 50 34 Z" fill="url(#sun)"/>
      <rect x="6" y="34" width="52" height="4.5" rx="2.25" fill="var(--veil)"/>
      <rect x="13" y="42.5" width="38" height="5.5" rx="2.75" fill="url(#lake)"/>
      <rect x="20.5" y="51.5" width="23" height="5" rx="2.5" fill="url(#lake)"/>
    </g>
  </g>
</svg>
