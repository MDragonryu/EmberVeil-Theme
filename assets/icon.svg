<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Emberveil</title>
  <desc id="desc">A sun rising over a lava lake, divided by a cool horizon.</desc>
  <style>
    /* Small optical size: no tile, transparent ground, heavy weights. The ember
       bloom is dropped here because a halo cannot resolve against an unknown
       background; the full Emberrise / Bloom Lake mark lives in icon-app.svg. */
    :root {
      --ember-deep: #BC531E;
      --ember: #FF9F5B;
      --ember-core: #FFD173;
      --veil: #73C7D6;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --ember-deep: #914321;
        --ember: #A44012;
        --ember-core: #A86B00;
        --veil: #1C6570;
      }
    }
  </style>

  <defs>
    <radialGradient id="sun" gradientUnits="userSpaceOnUse" cx="32" cy="34" r="20">
      <stop offset="0" style="stop-color: var(--ember-core)"/>
      <stop offset="0.5" style="stop-color: var(--ember)"/>
      <stop offset="1" style="stop-color: var(--ember-deep)"/>
    </radialGradient>
    <radialGradient id="lake" gradientUnits="userSpaceOnUse" cx="32" cy="45" r="22">
      <stop offset="0" style="stop-color: var(--ember-core)"/>
      <stop offset="0.45" style="stop-color: var(--ember)"/>
      <stop offset="1" style="stop-color: var(--ember-deep)"/>
    </radialGradient>
  </defs>

  <g transform="translate(0 -4)">
    <!-- The sun, hottest where it meets the horizon -->
    <path d="M14 34 A18 18 0 0 1 50 34 Z" fill="url(#sun)"/>
    <!-- The veil: one cool structural rule dividing the mark -->
    <rect x="6" y="34" width="52" height="4.5" rx="2.25" fill="var(--veil)"/>
    <!-- The lake: molten execution below the structure -->
    <rect x="13" y="42.5" width="38" height="5.5" rx="2.75" fill="url(#lake)"/>
    <rect x="20.5" y="51.5" width="23" height="5" rx="2.5" fill="url(#lake)"/>
  </g>
</svg>
