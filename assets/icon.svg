<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Emberveil</title>
  <desc id="desc">An ember held inside a cool structural veil.</desc>
  <style>
    /* Small optical size: no tile, transparent ground, two colours, heavy weights.
       The tile version lives alongside this file as icon-app.svg. */
    :root {
      --ember: #FF9F5B;
      --cool: #73C7D6;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --ember: #A44012;
        --cool: #1C6570;
      }
    }
  </style>

  <g transform="translate(32 32) scale(1.55) translate(-32 -32)">
    <path d="M16 17 L27.5 48 Q29 51 32 51 Q35 51 36.5 48 L48 17
             L40.5 21.5 L32 41 L23.5 21.5 Z" fill="var(--cool)" fill-rule="evenodd"/>
    <path d="M32 13 C38 20 41 25 40 31 C39.2 35.8 35.8 39 32 42
             C27.8 38.7 24 35 24 30 C24 24.5 27.7 19.1 32 13 Z" fill="var(--ember)"/>
  </g>
</svg>
